<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1A1714" />

    <meta
      name="description"
      content="Royal T: men's nutrition bars made with raw honey, royal jelly and whole-food ingredients. Handmade in Chicago."
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="%PUBLIC_URL%/royal-t/favicon.png" />
    <meta property="og:title" content="Royal T" />
    <meta property="og:description" content="Royal T: men's nutrition bars made with raw honey, royal jelly and whole-food ingredients. Handmade in Chicago." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/royal-t/og.jpg" />
    <title>Royal T | Men's Health &amp; Nutrition</title>

    <!-- 🔥 HARD BLOCK EMERGENT BADGE -->
    <style>
      #emergent-badge {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root"></div>

    <!-- 🔥 FORCE REMOVE IF INJECTED BY JS -->
    <script>
      const removeEmergentBadge = () => {
        const badge = document.getElementById("emergent-badge");
        if (badge) {
          badge.remove();
        }
      };

      // Run immediately
      removeEmergentBadge();

      // Run repeatedly in case something re-injects it
      setInterval(removeEmergentBadge, 500);
    </script>
  </body>
</html>
